name: paymentledger

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-auth}
      LEDGER_DB_PASSWORD: ${LEDGER_DB_PASSWORD:-ledger}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  auth-service:
    build: ./apps/auth-service
    environment:
      DATABASE_URL: postgres://auth:${AUTH_DB_PASSWORD:-auth}@postgres:5432/auth_db
      CORS_ORIGINS: ${WEB_ORIGIN:-http://localhost:3000,http://localhost:5173}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
    ports:
      - "4000:4000"
    volumes:
      - authkeys:/keys
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20

  ledger-api:
    build: ./apps/ledger-api
    # Secrets (R2 keys, OpenRouter/Anthropic keys) live here; it's gitignored.
    env_file:
      - path: ./apps/ledger-api/.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://ledger:${LEDGER_DB_PASSWORD:-ledger}@postgres:5432/ledger_db
      JWKS_URL: http://auth-service:4000/.well-known/jwks.json
      CORS_ORIGINS: ${WEB_ORIGIN:-http://localhost:3000,http://localhost:5173}
      # Used when R2 isn't configured (see apps/ledger-api/.env.example).
      STORAGE_DIR: /data/invoices
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-dev-internal-token}
      ENABLE_DEMO: ${ENABLE_DEMO:-true}
    ports:
      - "8000:8000"
    volumes:
      - invoicefiles:/data/invoices
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build: ./apps/web
    ports:
      - "3000:80"
    depends_on:
      auth-service:
        condition: service_healthy
      ledger-api:
        condition: service_healthy

  # Coming next: settlement-service (Circle Wallets / App Kit on Arc).

volumes:
  pgdata:
  authkeys:
  invoicefiles:
