[project]
name = "ledger-api"
version = "0.1.0"
description = "Core AP service: invoices, 3-way matching, ledger, settlement orchestration, agent"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.13.0",
    "asyncpg>=0.32.0",
    "boto3>=1.43.110",
    "email-validator>=2.3.0",
    "fastapi>=0.143.0",
    "openai>=3.27.0",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.15.1",
    "pypdf>=6.20.0",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"
