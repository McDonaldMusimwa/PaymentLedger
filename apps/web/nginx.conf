# Serves the built SPA and proxies both backends under one origin, so the refresh
# cookie is first-party and no CORS is needed.
server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 25m;

  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  location /auth/ {
    proxy_pass http://auth-service:4000;
  }

  # Trailing slash strips the /api prefix.
  location /api/ {
    proxy_pass http://ledger-api:8000/;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri /index.html;
  }
}
